services:
  mosquitto:
    build: ./mosquitto
    container_name: iotmodul-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:8884:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_server_certs:/mosquitto/certs
      - mosquitto_ca:/mosquitto/ca
    environment:
      MQTT_OPENHAB_PASSWORD: ${MQTT_OPENHAB_PASSWORD:?Copy .env.example to .env and set passwords}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?Copy .env.example to .env and set passwords}
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:8883 -servername mosquitto -CAfile /mosquitto/ca/ca.crt -verify_hostname mosquitto -verify_return_error </dev/null 2>/dev/null | grep -q 'Verify return code: 0'"]
      interval: 10s
      timeout: 5s
      retries: 5

  openhab:
    build: ./openhab
    container_name: iotmodul-openhab
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:8444:8443"
    environment:
      USER_ID: "9001"
      GROUP_ID: "9001"
      CRYPTO_POLICY: "unlimited"
      EXTRA_JAVA_OPTS: "-Duser.timezone=Europe/Kyiv"
      MQTT_OPENHAB_PASSWORD: ${MQTT_OPENHAB_PASSWORD:?Copy .env.example to .env and set passwords}
    volumes:
      - ./openhab/conf:/openhab/conf
      - ./openhab/conf/things:/run/openhab-things-source:ro
      - openhab_things:/openhab/conf/things
      - mosquitto_ca:/run/mqtt-ca:ro
      - openhab_userdata:/openhab/userdata
      - openhab_addons:/openhab/addons

  simulator:
    build: ./simulator
    container_name: iotmodul-simulator
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_USERNAME: simulator
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?Copy .env.example to .env and set passwords}
      MQTT_CA_FILE: /run/mqtt-ca/ca.crt
    volumes:
      - mosquitto_ca:/run/mqtt-ca:ro

volumes:
  mosquitto_data:
  mosquitto_server_certs:
  mosquitto_ca:
  openhab_userdata:
  openhab_things:
  openhab_addons:
